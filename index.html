<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Wake-Up Alarm</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6a64;--acc:#d9480f;--ok:#2b8a3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#f0eee8;--card:#201f1d;--mut:#a3a199;--acc:#ff7a3d;--ok:#51cf66}}
:root[data-theme="dark"]{--bg:#141413;--fg:#f0eee8;--card:#201f1d;--mut:#a3a199;--acc:#ff7a3d;--ok:#51cf66}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=time]{font-size:40px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);text-align:center}
textarea{width:100%;min-height:110px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--mut);background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 16px;background:var(--acc);color:#fff;width:100%;margin-top:10px}
button.alt{background:var(--mut)}
button:disabled{opacity:.4}
.mut{color:var(--mut);font-size:14px}
.big{font-size:26px;font-weight:700;line-height:1.3;margin:6px 0}
.pron{font-size:20px;color:var(--acc);font-weight:600}
.count{font-size:40px;font-weight:800}
#sos{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;width:auto;margin:0;padding:8px 12px;font-size:13px;background:#c92a2a;z-index:9;display:none}

.grid{display:grid;gap:6px;margin:10px auto;max-width:300px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.c{aspect-ratio:1;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;text-transform:uppercase;border-radius:6px}
.c.f{border-color:var(--fg)}
.c.g{background:var(--ok);border-color:var(--ok);color:#fff}
.c.y{background:#b8901c;border-color:#b8901c;color:#fff}
.c.x{background:var(--mut);border-color:var(--mut);color:#fff}
.kb{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.kr{display:flex;gap:4px;justify-content:center}
.k{flex:1;margin:0;padding:13px 0;font-size:14px;border-radius:6px;background:var(--bg);color:var(--fg);border:1px solid var(--mut);width:auto;min-width:0}
.k.w{flex:1.7}
.k.g{background:var(--ok);color:#fff}.k.y{background:#b8901c;color:#fff}.k.x{background:var(--mut);color:#fff}
.hide{display:none}
</style></head><body>
<button id="sos">EMERGENCY STOP</button>
<main>
<h1>Wake-Up Alarm</h1>

<div id="setup" class="card">
  <input type="time" id="t" value="07:00">
  <button id="arm">Arm alarm</button>
  <button id="test" class="alt">Test it now</button>
  <p class="mut" id="status">Not armed. Leave this page open, screen on, phone plugged in. It can’t ring if the browser is closed.</p>
</div>

<div id="s1" class="card hide">
  <div class="mut">Step 1 · Say it out loud, 5 times</div>
  <div class="count"><span id="n">0</span>/5</div>
  <div class="mut" id="lang"></div>
  <div class="big" id="native"></div>
  <div class="pron" id="pron"></div>
  <div class="mut" id="heard">Listening…</div>
  <button id="skipmic" class="alt hide">Mic not working? Tap to count one</button>
</div>

<div id="s2" class="card hide">
  <div class="mut">Step 2 · Wordle (<span id="wday"></span>)</div>
  <div class="grid" id="grid"></div>
  <div class="mut" id="wmsg" style="text-align:center;min-height:24px"></div>
  <div class="kb" id="kb"></div>
  <button id="wnext" class="alt hide">Failed. Load a different day</button>
</div>

<div id="s3" class="card hide">
  <div class="mut">Step 3 · Last one</div>
  <div class="big">Sell me this phone</div>
  <textarea id="pitch" placeholder="Type your pitch…"></textarea>
  <button id="done" disabled>Submit & stop alarm</button>
</div>

<div id="fin" class="card hide"><div class="big">Alarm stopped. Go be productive.</div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const L=[
 {n:"English",c:"en-US",t:"Time to get up, time to be productive",p:"Time to get up, time to be productive"},
 {n:"Japanese",c:"ja-JP",t:"起きる時間だ、生産的になる時間だ",p:"oh-kee-roo jee-kahn dah, say-sahn-teh-kee nee nah-roo jee-kahn dah"},
 {n:"German",c:"de-DE",t:"Zeit aufzustehen, Zeit produktiv zu sein",p:"tsite owf-tsoo-shtay-en, tsite pro-dook-teef tsoo zine"},
 {n:"Mandarin",c:"zh-CN",t:"是时候起床了，是时候高效了",p:"shur shur-hoh chee-chwahng luh, shur shur-hoh gow-shyow luh (Shì shíhou qǐchuáng le…)"}
];
let armed=null,ringing=false,count=0,lang=null,rec=null,recOn=false,ctx=null,beepTimer=null,wake=null,tick=null;
const store=(k,v)=>{try{v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){}};
try{const s=localStorage.getItem("alarmTime");if(s)$("t").value=s}catch(e){}

function show(id){["setup","s1","s2","s3","fin"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function norm(s){return s.toLowerCase().replace(/[\s,.!?、。，！？'’-]/g,"")}
function sim(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a.includes(b))return 1;
 const bg=s=>{const m={};for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m[g]=(m[g]||0)+1}return m};
 const A=bg(a),B=bg(b);let o=0,ta=0,tb=0;for(const g in A){ta+=A[g];if(B[g])o+=Math.min(A[g],B[g])}for(const g in B)tb+=B[g];
 return 2*o/(ta+tb||1)}

/* Alarm sound */
function startSound(){
 try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(e){}
 let on=false;
 beepTimer=setInterval(()=>{
  if(!ctx)return;const o=ctx.createOscillator(),g=ctx.createGain();
  o.type="square";o.frequency.value=on?880:660;on=!on;g.gain.value=.18;
  o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.22);
  if(navigator.vibrate)navigator.vibrate(200);
 },450);
}
function stopSound(){clearInterval(beepTimer);beepTimer=null;if(navigator.vibrate)navigator.vibrate(0)}

async function keepAwake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}

/* Arm */
$("arm").onclick=async()=>{
 armed=$("t").value;try{localStorage.setItem("alarmTime",armed)}catch(e){}
 try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}catch(e){}
 keepAwake();
 $("status").textContent="Armed for "+armed+". Keep this page open and the screen on.";
 $("arm").textContent="Re-arm / change time";
 clearInterval(tick);
 tick=setInterval(()=>{if(ringing||!armed)return;const d=new Date();
  const hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if(hm===armed){armed=null;ring()}},1000);
};
$("test").onclick=async()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();await ctx.resume()}catch(e){}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}catch(e){}
 keepAwake();ring()};

/* Ring flow */
function ring(){
 ringing=true;count=0;$("sos").style.display="block";startSound();
 lang=L[Math.floor(Math.random()*L.length)];
 $("n").textContent=0;$("lang").textContent="Say this in "+lang.n+":";
 $("native").textContent=lang.t;$("pron").textContent="Sounds like: "+lang.p;
 $("heard").textContent="Listening…";show("s1");listen();
}
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$("heard").textContent="Speech recognition isn’t supported in this browser. Use Chrome.";$("skipmic").classList.remove("hide");return}
 $("skipmic").classList.remove("hide");
 rec=new SR();rec.lang=lang.c;rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=3;recOn=true;
 rec.onresult=e=>{
  for(let i=e.resultIndex;i<e.results.length;i++){
   if(!e.results[i].isFinal)continue;
   let best=0,txt="";
   for(let j=0;j<e.results[i].length;j++){const tr=e.results[i][j].transcript;const s=sim(tr,lang.t);if(s>=best){best=s;txt=tr}}
   $("heard").textContent="Heard: “"+txt+"”"+(best>=.5?" (match)":" (no match, try again)");
   if(best>=.5)bump();
  }};
 rec.onend=()=>{if(recOn&&count<5)setTimeout(()=>{try{rec.start()}catch(e){}},250)};
 rec.onerror=e=>{if(e.error==="not-allowed"){$("heard").textContent="Mic blocked. Allow microphone for this site."}};
 try{rec.start()}catch(e){}
}
function bump(){
 if(count>=5)return;count++;$("n").textContent=count;
 if(count>=5){recOn=false;try{rec.stop()}catch(e){};setTimeout(()=>{tries=0;startWordle();show("s2")},700)}
}
$("skipmic").onclick=bump;

/* Wordle */
const W="about above abuse actor acute adapt admit adopt adult after again agent agree ahead alarm album alert alien align alike allow alone along alter among ample angel anger angle angry ankle apart apple apply arena argue arise armor aroma array aside asset atlas attic audio avoid awake award aware awful bacon badge baker basic basin basis batch beach beard began begin being below bench berry birth black blade blame blank blast blaze bleak blend bless blind block blond blood blown blues bluff blunt board boast bonus booth boost bound brain brake brand brave bread break breed brick bride brief brink brisk broad broke brook broom brown brush buddy build built bunch burst buyer cabin cable camel canal candy cargo carry carve cause cease chain chair chalk champ chant chaos charm chart chase cheap cheat check cheek cheer chess chief child chill chose chunk cider cigar civic civil claim clash class clean clear clerk click cliff climb cling close cloth cloud clown coach coast cobra cocoa color comet comic coral couch cough could count court cover crack craft crash crawl crazy cream creek crest crime crisp cross crowd crown crude cruel crush curve cycle daily dairy daisy dance dealt death debut decay decor delay delta dense depth derby devil diary dirty ditch diver dizzy dodge doing donor dough dozen draft drain drama drank drape drawn dream dress dried drift drill drink drive drove drown drums dusty dwarf eager eagle early earth easel eaten eight elbow elder elect elite email ember empty enact enemy enjoy enter entry equip erase error essay event every exile exist extra fable faint fairy faith false fancy fatal fault feast fever fiber fiery fifth fifty fight final finch first flame flash flask fleet flesh flick fling float flock flood floor flour fluid flute focal focus foggy force forge forth forty forum found frame frank fraud fresh friar fried front frost fruit funny gamma gauge gaunt gecko ghost giant giddy given gizmo glade glass gleam glide globe gloom glory gloss idge rifle rigid rinse risky rival river roast robin robot rocky rodeo rogue rough round route rover royal rugby ruler rumor rural sadly safer saint salad salon salsa sandy satin sauce sauna saute scale scalp scare scarf scene scent scone scoop score scout scrap screw scrub seize sense serve setup seven shade shaft shake shall shame shape share shark sharp shave sheer sheet shelf shell shift shine shiny shirt shock shore short shout shown shrug sight sigma silly since sixth sixty skill skirt skull slate slave sleep slice slide slope small smart smell smile smoke snack snail snake sneak solar solve sonic sorry sound south space spare spark speak speed spell spend spice spike spill spine spoke spoon sport spray stack staff stage stain stair stake stale stamp stand stare start state steak steal steam steel steep steer stern stiff still sting stock stone stood stool store storm story stove strap straw stray strip stuck study stuff style sugar sunny super surge sushi swamp swarm swear sweat sweep sweet swift swing sword syrup table tacit taffy taken tango taste tease teddy teeth tempo tenor tense tenth thank theft theme there these thick thief thing think third thorn those threw throw thumb tiger tight timer timid tired title toast today token tonic tooth topic torch total touch tough towel toxic trace track trade trail train trait tramp trash tread treat trend trial tribe trick tried trout truck truly trunk trust truth tulip tumor tuner tunic turbo tutor twice twist ultra uncle under undue unfit union unite unity until upset urban usage usher usual utter vague valid valor value valve vapor vault vegan venue verse vigor vinyl viola viral visit visor vista vital vivid vocal vodka voice voter vowel wafer wagon waist waltz waste watch water weary weave weigh weird whale wheat wheel where which while whirl white whole whose widen widow width wield windy witch woman world worse worst worth would wound woven wrath wreck wrist write wrong wrote yacht yearn yeast yield young youth zebra".split(" ");
let tries=0,guesses=[],cur="",over=false,answer="";
const dayNum=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
const msg=t=>{$("wmsg").textContent=t};
function startWordle(){
 const d=dayNum-tries;answer=W[(d*389)%W.length];guesses=[];cur="";over=false;
 $("wday").textContent=tries?tries+" day"+(tries>1?"s":"")+" ago":"today";
 $("wnext").classList.add("hide");msg("");render();
}
function score(g){const r=["x","x","x","x","x"],a=answer.split(""),u=[0,0,0,0,0];
 for(let i=0;i<5;i++)if(g[i]===a[i]){r[i]="g";u[i]=1}
 for(let i=0;i<5;i++)if(r[i]!=="g"){const j=a.findIndex((c,k)=>!u[k]&&c===g[i]);if(j>-1){r[i]="y";u[j]=1}}
 return r}
function render(){
 const gr=$("grid");gr.innerHTML="";
 for(let r=0;r<6;r++){const row=document.createElement("div");row.className="row";
  const g=guesses[r],isCur=r===guesses.length&&!over,sc=g?score(g):null;
  for(let i=0;i<5;i++){const c=document.createElement("div");c.className="c";
   if(g){c.textContent=g[i];c.classList.add(sc[i])}
   else if(isCur&&cur[i]){c.textContent=cur[i];c.classList.add("f")}
   row.appendChild(c)}
  gr.appendChild(row)}
 const st={},rank={x:1,y:2,g:3};
 guesses.forEach(g=>{const sc=score(g);for(let i=0;i<5;i++){const l=g[i];if(!st[l]||rank[sc[i]]>rank[st[l]])st[l]=sc[i]}});
 "abcdefghijklmnopqrstuvwxyz".split("").forEach(l=>{$("k_"+l).className="k"+(st[l]?" "+st[l]:"")});
}
function key(k){if(over)return;
 if(k==="Enter")submit();
 else if(k==="Backspace"){cur=cur.slice(0,-1);render()}
 else if(/^[a-z]$/.test(k)&&cur.length<5){cur+=k;render()}}
function submit(){
 if(cur.length<5){msg("Need 5 letters");return}
 guesses.push(cur);cur="";
 const last=guesses[guesses.length-1];
 if(last===answer){over=true;msg("Solved!");render();setTimeout(()=>show("s3"),1000)}
 else if(guesses.length===6){over=true;msg("The word was "+answer.toUpperCase());render();$("wnext").classList.remove("hide")}
 else{msg("");render()}}
function mk(t,k,cl){const b=document.createElement("button");b.className="k "+cl;b.textContent=t.length===1?t.toUpperCase():t;if(t.length===1)b.id="k_"+t;b.onclick=()=>key(k);return b}
["qwertyuiop","asdfghjkl","zxcvbnm"].forEach((r,ri)=>{const d=document.createElement("div");d.className="kr";
 if(ri===2)d.appendChild(mk("Enter","Enter","w"));
 for(const l of r)d.appendChild(mk(l,l,""));
 if(ri===2)d.appendChild(mk("Del","Backspace","w"));
 $("kb").appendChild(d)});
document.addEventListener("keydown",e=>{if($("s2").classList.contains("hide")||e.ctrlKey||e.metaKey||e.altKey)return;
 key(e.key.length===1?e.key.toLowerCase():e.key)});
$("wnext").onclick=()=>{tries++;startWordle()};

/* Pitch */
$("pitch").oninput=()=>{$("done").disabled=!$("pitch").value.trim()};
$("done").onclick=stopAll;

function stopAll(){
 ringing=false;recOn=false;try{rec&&rec.stop()}catch(e){}
 stopSound();$("sos").style.display="none";
 try{wake&&wake.release()}catch(e){}
 show("fin");setTimeout(()=>show("setup"),4000);
}
$("sos").onclick=()=>{if(confirm("Emergency stop the alarm?"))stopAll()};
</script></body></html>
